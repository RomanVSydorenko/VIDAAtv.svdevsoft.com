<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>SV Dev Soft TV</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>SV Dev Soft TV</h1>
            <div id="status" class="status">Loading...</div>
        </header>
        
        <main>
            <div class="content-wrapper">
                <div id="store-container">
                    <iframe 
                        id="store-iframe" 
                        src="https://tv.svdevsoft.com/"
                        frameborder="0"
                        allowfullscreen
                        allow="autoplay; encrypted-media"
                    ></iframe>
                </div>
            </div>
        </main>
        
        <footer>
            <div class="help-text">
                <span class="key-hint">◀ Back</span>
                <span class="key-hint">🔄 Reload</span>
                <span class="key-hint">Exit to quit</span>
            </div>
        </footer>
    </div>
    
    <!-- VIDAA SDK -->
    <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
    
    <!-- Application scripts -->
    <script src="js/vidaa-handler.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
